<text class="lcap" x="400" y="430">READING THIS FIGURE</text>
<text class="lnote" x="400" y="450">Domain classes in Figure 1 hold no behaviour of</text>
<text class="lnote" x="400" y="465">their own. Every rule — who may create, approve</text>
<text class="lnote" x="400" y="480">or return a task — is enforced here and in the four</text>
<text class="lnote" x="400" y="495">stored procedures, which re-check the acting</text>
<text class="lnote" x="400" y="510">account role before writing.</text>
<text class="lnote" x="400" y="540">Dashed arrows read as «use» dependencies.</text>
