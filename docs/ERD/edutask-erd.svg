<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title{font-size:34px;font-weight:700;fill:#12361a}.sub{font-size:17px;fill:#4a6a4d}
      .box{fill:#f7fbf7;stroke:#5a8a5c;stroke-width:3}.head{fill:#d5e8d4;stroke:#5a8a5c;stroke-width:3}
      .name{font-size:18px;font-weight:700;fill:#12361a}.attr{font-size:13px;fill:#244b29}.key{font-weight:700}
      .rel{fill:none;stroke:#789d7b;stroke-width:2.5}.dash{stroke-dasharray:10 7}.lbl{font-size:12px;font-weight:600;fill:#2f6b34}
      .legend{font-size:14px;fill:#244b29}.note{font-size:13px;fill:#4a6a4d}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#789d7b"/>
    </marker>
  </defs>

  <rect width="1600" height="1260" fill="#fff"/>
  <text class="title" x="800" y="48" text-anchor="middle">EduTask — Entity-Relationship Diagram</text>
  <text class="sub" x="800" y="78" text-anchor="middle">4 strong · 4 weak · 3 associative entities · current proof merged into Subtask</text>

  <!-- Relationships are drawn behind entities. -->
  <g marker-end="url(#arrow)">
    <path class="rel" d="M750 190 C620 190 520 220 430 280"/>
    <path class="rel" d="M850 190 C990 190 1080 220 1170 280"/>
    <path class="rel" d="M300 430 L210 500"/>
    <path class="rel" d="M350 430 L400 550"/>
    <path class="rel" d="M1050 430 L850 550"/>
    <path class="rel" d="M540 695 L540 760"/>
    <path class="rel" d="M730 625 L760 625"/>
    <path class="rel" d="M1000 625 L1110 625"/>
    <path class="rel dash" d="M1080 410 L1170 520"/>
    <path class="rel dash" d="M520 370 C810 400 980 470 1110 550"/>
    <path class="rel dash" d="M1030 370 C830 450 640 610 590 790"/>
    <path class="rel dash" d="M470 430 C510 560 500 670 470 760"/>
    <path class="rel" d="M500 980 L250 1030"/>
    <path class="rel" d="M730 865 L760 865"/>
    <path class="rel" d="M730 915 C900 950 1050 930 1150 885"/>
    <path class="rel" d="M650 650 C720 720 750 770 780 815"/>
    <path class="rel dash" d="M300 430 C250 690 170 850 170 1030"/>
    <path class="rel dash" d="M1030 430 C940 700 570 940 370 1080"/>
  </g>

  <g>
    <text class="lbl" x="566" y="197">assigned role</text>
    <text class="lbl" x="980" y="197">assigned role</text>
    <text class="lbl" x="225" y="478">audited</text>
    <text class="lbl" x="350" y="510">creates</text>
    <text class="lbl" x="900" y="532">receives</text>
    <text class="lbl" x="414" y="735">contains</text>
    <text class="lbl" x="625" y="614">has assignments</text>
    <text class="lbl" x="1018" y="614">assigned teacher</text>
    <text class="lbl" x="1060" y="480">notification state</text>
    <text class="lbl" x="790" y="405">notification state</text>
    <text class="lbl" x="790" y="525">claims current proof</text>
    <text class="lbl" x="475" y="610">reviews current proof</text>
    <text class="lbl" x="290" y="1010">archives attempts</text>
    <text class="lbl" x="630" y="854">has comments</text>
    <text class="lbl" x="815" y="946">read state</text>
    <text class="lbl" x="610" y="716">subtask thread</text>
    <text class="lbl" x="120" y="780">reviews attempts</text>
    <text class="lbl" x="675" y="875">submits attempts</text>
  </g>

  <!-- Strong entities -->
  <g transform="translate(650 110)">
    <rect class="box" width="300" height="110" rx="4"/><rect class="head" width="300" height="36" rx="4"/>
    <text class="name" x="150" y="24" text-anchor="middle">Roles</text>
    <text class="attr key" x="14" y="59">PK RoleID : int</text><text class="attr" x="14" y="80">RoleName : nvarchar(50)</text>
  </g>
  <g transform="translate(250 280)">
    <rect class="box" width="350" height="150" rx="4"/><rect class="head" width="350" height="36" rx="4"/>
    <text class="name" x="175" y="24" text-anchor="middle">User</text>
    <text class="attr key" x="14" y="59">PK UserID : int</text><text class="attr" x="14" y="80">FK RoleID : int</text>
    <text class="attr" x="14" y="101">FirstName, LastName, Email</text><text class="attr" x="14" y="122">PasswordHash, PasswordSalt</text>
    <text class="attr" x="14" y="143">IsActive, ProfilePicture</text>
  </g>
  <g transform="translate(1000 280)">
    <rect class="box" width="350" height="150" rx="4"/><rect class="head" width="350" height="36" rx="4"/>
    <text class="name" x="175" y="24" text-anchor="middle">Teacher</text>
    <text class="attr key" x="14" y="59">PK TeacherID : int</text><text class="attr" x="14" y="80">FK RoleID : int</text>
    <text class="attr" x="14" y="101">FirstName, LastName, Email</text><text class="attr" x="14" y="122">PasswordHash, PasswordSalt</text>
    <text class="attr" x="14" y="143">IsActive, ProfilePicture</text>
  </g>
  <g transform="translate(350 550)">
    <rect class="box" width="380" height="145" rx="4"/><rect class="head" width="380" height="36" rx="4"/>
    <text class="name" x="190" y="24" text-anchor="middle">Task</text>
    <text class="attr key" x="14" y="59">PK TaskID : int</text><text class="attr" x="14" y="80">FK CreatedByUserID : int</text>
    <text class="attr" x="14" y="101">Title, Description, Status</text>
    <text class="attr" x="14" y="122">FK CompletionApprovedByUserID</text>
  </g>

  <!-- Weak entities use a double border. -->
  <g transform="translate(20 500)">
    <rect class="box" width="310" height="145" rx="4"/><rect x="7" y="7" width="296" height="131" rx="3" fill="none" stroke="#5a8a5c" stroke-width="2"/>
    <rect class="head" width="310" height="36" rx="4"/><text class="name" x="155" y="24" text-anchor="middle">AccountRoleChangeLog</text>
    <text class="attr key" x="14" y="59">PK ChangeLogID : int</text><text class="attr" x="14" y="80">FK UserID, ChangedByUserID</text>
    <text class="attr" x="14" y="101">OldRoleID, NewRoleID</text><text class="attr" x="14" y="122">Reason, ChangedAt</text>
  </g>
  <g transform="translate(350 760)">
    <rect class="box" width="380" height="220" rx="4"/><rect x="7" y="7" width="366" height="206" rx="3" fill="none" stroke="#5a8a5c" stroke-width="2"/>
    <rect class="head" width="380" height="36" rx="4"/><text class="name" x="190" y="24" text-anchor="middle">Subtask</text>
    <text class="attr key" x="14" y="58">PK SubtaskID · FK TaskID</text><text class="attr" x="14" y="78">Title, IsCompleted</text>
    <text class="attr" x="14" y="102">ProofFile, ProofFileName, ProofContentType</text>
    <text class="attr" x="14" y="123">ProofValidationStatus, ProofUploadedAt</text>
    <text class="attr" x="14" y="144">FK ProofSubmittedByTeacherID</text>
    <text class="note" x="14" y="204">One shared current proof slot per subtask</text>
  </g>
  <g transform="translate(35 1030)">
    <rect class="box" width="430" height="185" rx="4"/><rect x="7" y="7" width="416" height="171" rx="3" fill="none" stroke="#5a8a5c" stroke-width="2"/>
    <rect class="head" width="430" height="36" rx="4"/><text class="name" x="215" y="24" text-anchor="middle">SubtaskProofHistory</text>
    <text class="attr key" x="14" y="59">PK HistoryID · FK SubtaskID</text><text class="attr" x="14" y="80">UQ SubtaskID + AttemptNumber</text>
    <text class="attr" x="14" y="101">FileName, ContentType, FileData</text><text class="attr" x="14" y="122">ValidationStatus, SubmittedAt</text>
    <text class="attr" x="14" y="143">FK SubmittedByTeacherID</text><text class="attr" x="14" y="164">ReviewedAt, ReviewedByUserID, ReturnRemarks</text>
  </g>
  <g transform="translate(760 790)">
    <rect class="box" width="360" height="165" rx="4"/><rect x="7" y="7" width="346" height="151" rx="3" fill="none" stroke="#5a8a5c" stroke-width="2"/>
    <rect class="head" width="360" height="36" rx="4"/><text class="name" x="180" y="24" text-anchor="middle">TaskDiscussion</text>
    <text class="attr key" x="14" y="59">PK DiscussionID</text><text class="attr" x="14" y="80">FK TaskID · FK SubtaskID?</text>
    <text class="attr" x="14" y="101">AuthorType, AuthorID, AuthorName</text><text class="attr" x="14" y="122">MessageType, DiscussionText</text>
    <text class="attr" x="14" y="143">CreatedAt</text>
  </g>

  <!-- Associative entities use clipped corners. -->
  <g transform="translate(760 550)">
    <path class="box" d="M12 0 H298 L310 12 V138 L298 150 H12 L0 138 V12 Z"/><path class="head" d="M12 0 H298 L310 12 V36 H0 V12 Z"/>
    <text class="name" x="155" y="24" text-anchor="middle">TaskAssignment</text>
    <text class="attr key" x="14" y="59">PK AssignmentID</text><text class="attr" x="14" y="80">FK TaskID · FK TeacherID</text>
    <text class="attr" x="14" y="101">Deadline, Priority, AssignedAt</text><text class="attr" x="14" y="122">IsAcknowledged, AcknowledgedAt</text>
    <text class="attr" x="14" y="143">CompletionStatus, CompletedAt</text>
  </g>
  <g transform="translate(1130 520)">
    <path class="box" d="M12 0 H408 L420 12 V148 L408 160 H12 L0 148 V12 Z"/><path class="head" d="M12 0 H408 L420 12 V36 H0 V12 Z"/>
    <text class="name" x="210" y="24" text-anchor="middle">NotificationState</text>
    <text class="attr key" x="14" y="59">PK RecipientType + RecipientID + NotificationKey</text>
    <text class="attr" x="14" y="82">ReadAt, HiddenAt</text>
    <text class="note" x="14" y="112">Polymorphic recipient; notifications are query-generated.</text>
  </g>
  <g transform="translate(1150 790)">
    <path class="box" d="M12 0 H388 L400 12 V138 L388 150 H12 L0 138 V12 Z"/><path class="head" d="M12 0 H388 L400 12 V36 H0 V12 Z"/>
    <text class="name" x="200" y="24" text-anchor="middle">TaskDiscussionRead</text>
    <text class="attr key" x="14" y="59">PK/FK SubtaskID + ReaderType + ReaderID</text>
    <text class="attr" x="14" y="82">LastReadDiscussionID, ReadAt</text>
    <text class="note" x="14" y="112">Per-reader state for a subtask discussion thread.</text>
  </g>

  <g transform="translate(610 1030)">
    <rect x="0" y="0" width="930" height="185" rx="8" fill="#f7fbf7" stroke="#b7ceb9" stroke-width="2"/>
    <text class="name" x="22" y="32">Legend and shared-proof rule</text>
    <rect class="box" x="22" y="52" width="90" height="42"/><text class="legend" x="125" y="78">Strong entity</text>
    <rect class="box" x="290" y="52" width="90" height="42"/><rect x="297" y="59" width="76" height="28" fill="none" stroke="#5a8a5c" stroke-width="2"/>
    <text class="legend" x="393" y="78">Weak entity</text>
    <path class="box" d="M562 52 H638 L650 64 V82 L638 94 H562 L550 82 V64 Z"/><text class="legend" x="663" y="78">Associative entity</text>
    <text class="note" x="22" y="125">The first assigned teacher who uploads proof atomically claims Subtask.ProofSubmittedByTeacherID.</text>
    <text class="note" x="22" y="148">Other teachers assigned to the same shared task can view the shared result, but cannot replace, confirm, or remove that proof.</text>
    <text class="note" x="22" y="171">Confirmed attempts remain in SubtaskProofHistory; the former SubtaskProof entity no longer exists.</text>
  </g>
</svg>
