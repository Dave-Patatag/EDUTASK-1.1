<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    EduTask app icon foreground.

    The clipboard-and-check motif from Resources/Images/loginlogo.png, reduced to
    the two shapes that survive at 48px. The wordmark itself is not used here —
    at launcher size "EDUTASK" is unreadable, so the mark carries the brand.

    The check badge sits in a navy ring so the logo green reads against the white
    board: #00FF36 is only 1.37:1 on white, but 12.28:1 on the navy, so the green
    is placed on navy and the tick inside it is cut back out in navy.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Clipboard board -->
    <rect x="86" y="99" width="196" height="232" rx="24" fill="#FFFFFF"/>

    <!-- Clip at the top -->
    <rect x="144" y="67" width="80" height="52" rx="16" fill="#FFFFFF"/>
    <rect x="160" y="83" width="48" height="20" rx="10" fill="#111C3A"/>

    <!-- Task rows -->
    <rect x="118" y="155" width="98" height="18" rx="9" fill="#111C3A" opacity="0.25"/>
    <rect x="118" y="199" width="98" height="18" rx="9" fill="#111C3A" opacity="0.25"/>
    <rect x="118" y="243" width="64" height="18" rx="9" fill="#111C3A" opacity="0.25"/>

    <!-- Completion badge -->
    <circle cx="284" cy="303" r="86" fill="#111C3A"/>
    <circle cx="284" cy="303" r="68" fill="#00FF36"/>
    <path d="M252 303 l24 24 44 -50"
          fill="none" stroke="#111C3A" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
</svg>
